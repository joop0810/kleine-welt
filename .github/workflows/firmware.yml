name: Firmware bauen

# Baut Kleine Welt in der Cloud und legt die vier Flash-Teile nach firmware/.
# Vorher laeuft der PC-Test (host/sim.cpp), der den Raum per Touch durchspielt.
# Danach ist die Installer-Seite (GitHub Pages aus main) automatisch aktuell.
#
# Startet bei jeder Aenderung am Quellcode oder per Hand:
# Actions -> "Firmware bauen" -> Run workflow.

on:
  push:
    branches: [main]
    paths: ['firmware-src/**', 'host/**', 'tools/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: PC-Test (Raum durchspielen)
        run: |
          g++ -O2 -std=c++17 -Ifirmware-src/KleineWelt host/sim.cpp firmware-src/KleineWelt/game.cpp -o sim
          mkdir -p sim-out && ./sim sim-out

      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-esp32-3.3.11-gfx-1.6.7-sensor-0.4.1-xpowers-0.3.3
      - name: ESP32-Core und Bibliotheken (gleiche Versionen wie TamaPoke)
        run: |
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls $URL
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls $URL
          arduino-cli lib install "GFX Library for Arduino@1.6.7" "SensorLib@0.4.1" "XPowersLib@0.3.3"

      - name: Kompilieren
        run: |
          set -o pipefail
          FQBN="esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          if ! arduino-cli compile --fqbn "$FQBN" --export-binaries firmware-src/KleineWelt 2>&1 | tee build.log; then
            grep -E "error|Error" build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Firmware und Manifest aktualisieren
        run: |
          B=firmware-src/KleineWelt/build/esp32.esp32.esp32s3
          mkdir -p firmware
          cp "$B/KleineWelt.ino.bootloader.bin" firmware/bootloader.bin
          cp "$B/KleineWelt.ino.partitions.bin" firmware/partitions.bin
          cp "$B/boot_app0.bin"                 firmware/boot_app0.bin
          cp "$B/KleineWelt.ino.bin"            firmware/app.bin
          # bricht ab, wenn die Partitionstabelle nicht mehr zu TamaPoke passt
          python3 tools/make_manifest.py

      - name: Einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware manifest.json
          if git diff --cached --quiet; then echo "nichts geaendert"; exit 0; fi
          git commit -m "Firmware gebaut ($(grep -o 'FW_VERSION "[0-9.]*"' firmware-src/KleineWelt/KleineWelt.ino | grep -o '[0-9.]*'))"
          git push
